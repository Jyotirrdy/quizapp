<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App with Timer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Quiz App</h1>
    <p id="status">Press start to begin the timed quiz.</p>

    <section id="quiz-card" class="card hidden">
      <div class="meta">
        <span id="question-count"></span>
        <span id="timer">Time: 15s</span>
      </div>
      <h2 id="question-text"></h2>
      <div id="answers" class="answers"></div>
    </section>

    <section id="result-card" class="card hidden">
      <h2>Quiz Finished</h2>
      <p id="score"></p>
      <button id="restart-btn">Try Again</button>
    </section>

    <button id="start-btn">Start Quiz</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
